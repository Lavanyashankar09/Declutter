services:
  declutter:
    build: .
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-google/gemini-2.5-flash}
      - OPENROUTER_VISION_MODEL=${OPENROUTER_VISION_MODEL:-google/gemini-2.5-flash}
    volumes:
      - ./desktop:/app/desktop:ro
      - ./output:/app/output
    command: ["python", "main.py", "./desktop", "-o", "./output"]

  query:
    build: .
    volumes:
      - ./output:/app/output
    entrypoint: ["python", "query.py"]
    # Usage: docker compose run query "your search query"
